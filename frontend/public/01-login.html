<!DOCTYPE html><!-- Indica que se está utilizando HTML5 -->
<html lang="es"><!-- Documento en español -->
<head>
    <meta charset="UTF-8"><!-- Permite mostrar caracteres especiales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Adapta la página a diferentes dispositivos -->
    <title>Iniciar Sesión - Gestión de Prácticas</title>

    <!-- Conexión con CSS -->
    <link rel="stylesheet" href="assets/estilo.css">
</head>

<body class="login-body" data-pagina="login"><!-- Esta página no exige sesión -->

    <div class="login-container"><!-- Contenedor principal del formulario -->

        <div class="logo-container">
            <div class="logo">GP</div><!-- Logo del sistema -->
        </div>

        <h1>Gestión de Prácticas</h1>
        <p class="login-subtitle">Inicia sesión para continuar</p>

        <form id="formLogin" novalidate>

            <div class="input-group">
                <label for="correo">Correo institucional</label>
                <input type="email" id="correo" placeholder="Ingrese su correo" autocomplete="username" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña" autocomplete="current-password">
            </div>

            <div class="login-options">
                <label>
                    <input type="checkbox" id="recordar"><!-- Mantiene la sesión al cerrar el navegador -->
                    Recordarme
                </label>

                <a href="#" id="olvidoClave">¿Olvidaste tu contraseña?</a>
            </div>

            <p id="mensajeLogin" class="mensaje" hidden></p><!-- Aquí salen los errores de inicio de sesión -->

            <button type="submit" class="btn-login">Iniciar sesión</button>

        </form>

        <p class="login-footer">
            Sistema de Gestión de Prácticas Académicas<br>
        </p>

    </div>

<script type="module" src="assets/firebase-login.js"></script>
</body>
</html>
